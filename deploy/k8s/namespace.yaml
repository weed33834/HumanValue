# =============================================================================
# Namespace 定义
# -----------------------------------------------------------------------------
# HumanValue 所有资源部署在独立的 humanvalue 命名空间内,实现资源与网络隔离。
# Kustomize 会自动把其余资源的 namespace 设为 humanvalue(见 kustomization.yaml)。
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: humanvalue
  labels:
    app.kubernetes.io/name: humanvalue
    app.kubernetes.io/part-of: humanvalue
