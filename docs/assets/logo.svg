<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1026"/>
      <stop offset="1" stop-color="#141A38"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F7CFF"/>
      <stop offset="0.55" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#B44CFF"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F7CFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7C5CFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#B44CFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 圆角底 -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)" stroke="rgba(124,92,255,0.35)" stroke-width="2"/>
  <!-- 轨道 -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#orbit)" stroke-width="6" opacity="0.5"/>
  <circle cx="256" cy="62" r="10" fill="#B44CFF"/>
  <circle cx="414" cy="176" r="8" fill="#7C5CFF" opacity="0.8"/>
  <circle cx="104" cy="160" r="6" fill="#4F7CFF" opacity="0.7"/>
  <circle cx="150" cy="390" r="7" fill="#7C5CFF" opacity="0.6"/>
  <!-- 中心 A + 核心 (Agent + 价值坐标) -->
  <path d="M256 96 L368 376 H336 L306 312 H206 L176 376 H144 Z M238 276 H274 L256 216 Z" fill="url(#core)"/>
  <!-- 上升箭头 (价值增长) -->
  <path d="M168 312 L222 262 L250 286 L340 200" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>
  <path d="M340 200 H292 M340 200 V248" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>
</svg>
