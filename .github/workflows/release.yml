# CD Pipeline: 镜像推送 + 环境晋升
# 当 push tag v* 时触发，构建并推送镜像到 GHCR，然后部署到 staging
name: Release & Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: 构建并推送镜像到 GHCR
  # ──────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      # 版本守卫: tag 必须与仓库唯一版本源 VERSION 一致,防止 v9.9.9 之类
      # 漂移 tag 走完整发布链产出与仓库声明不符的镜像
      - name: Guard — tag must match VERSION file
        if: github.event_name == 'push'
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION 与 VERSION 文件($FILE_VERSION)不一致,拒绝发布"
            exit 1
          fi
          echo "tag=$TAG_VERSION 与 VERSION 一致,继续发布"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/humanvalue-backend
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/humanvalue-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/humanvalue-backend:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/humanvalue-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/humanvalue-frontend:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/humanvalue-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────
  # Job 2: 安全扫描推送的镜像
  # ──────────────────────────────────────────────────────────
  scan-images:
    name: Scan Images (Trivy)
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy on backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/humanvalue-backend:${{ needs.build-and-push.outputs.image_tag }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Run Trivy on frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/humanvalue-frontend:${{ needs.build-and-push.outputs.image_tag }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  # ──────────────────────────────────────────────────────────
  # Job 3: 部署到 staging 环境
  # ──────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push, scan-images]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to staging via SSH
        id: deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/humanvalue
            # 拉取最新 compose 文件
            git pull origin main
            # 拉取新镜像
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            # 滚动重启
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps --build
            # 运行数据库迁移
            docker compose exec -T backend python -m alembic upgrade head
            # 健康检查
            sleep 10
            curl -f http://localhost:8000/health || exit 1
            echo "Deploy URL: https://staging.humanvalue.example.com"

  # ──────────────────────────────────────────────────────────
  # Job 4: 手动晋升到生产环境
  # ──────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, scan-images]
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5

      - name: Deploy to production via SSH
        id: deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/humanvalue
            git pull origin main
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps --build
            docker compose exec -T backend python -m alembic upgrade head
            sleep 15
            curl -f http://localhost:8000/health || exit 1
            echo "Deploy URL: https://humanvalue.example.com"

  # ──────────────────────────────────────────────────────────
  # Job 5: 创建 GitHub Release
  # ──────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push, scan-images]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract changelog
        id: changelog
        run: |
          # 从 CHANGELOG.md 提取当前版本变更
          VERSION=${GITHUB_REF#refs/tags/}
          # 获取两个 tag 之间的提交作为 changelog
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" $PREV_TAG..HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD~20..HEAD)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.changelog.outputs.version }}
          body: |
            ## Release ${{ steps.changelog.outputs.version }}

            ### Changes
            ${{ steps.changelog.outputs.body }}

            ### Docker Images
            - Backend: `${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/humanvalue-backend:${{ steps.changelog.outputs.version }}`
            - Frontend: `${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/humanvalue-frontend:${{ steps.changelog.outputs.version }}`
          draft: false
          prerelease: ${{ contains(steps.changelog.outputs.version, '-rc') || contains(steps.changelog.outputs.version, '-beta') }}
