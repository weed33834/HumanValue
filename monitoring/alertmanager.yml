# P1: Alertmanager 告警通知配置
#
# 将 Prometheus 告警路由到通知通道:
# - critical: Webhook(飞书/钉钉网关) + 邮件
# - warning: 邮件
#
# 环境变量注入(docker-compose.prod.yml 已启用 --config.expand-env):
#   - ALERT_WEBHOOK_URL: 飞书/钉钉 Webhook 地址(compose 默认给 .invalid 占位,
#    未配置时投递会失败并留下日志,不会静默回环)
#   - ALERT_EMAIL_TO: 告警邮件收件人
#
# 注意:
#   - expand-env 只替换 $VAR / ${VAR},不支持默认值语法;compose 侧负责兜底默认值。
#   - SMTP 认证(smtp_auth_username/password)涉及敏感信息,不走环境变量模板,
#     需要邮件告警的部署请挂载自定义 alertmanager.yml 覆盖本文件。

global:
  resolve_timeout: 5m
  # SMTP 中继地址: 默认指向本机,绝大多数部署不可用;真实环境请覆盖为你的 SMTP 服务器
  smtp_smarthost: localhost:587
  smtp_from: alertmanager@humanvalue.ai

# 告警路由规则
route:
  group_by: ["alertname", "service", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"
  routes:
    # critical 告警: 即时通知 Webhook + 邮件
    - match:
        severity: critical
      receiver: "critical-webhook"
      group_wait: 10s
      repeat_interval: 1h
    # warning 告警: 邮件通知
    - match:
        severity: warning
      receiver: "warning-email"

receivers:
  - name: "default"
    email_configs:
      - to: admin@humanvalue.ai
        send_resolved: true

  - name: "critical-webhook"
    webhook_configs:
      # 飞书/钉钉 Webhook 网关地址,由 ALERT_WEBHOOK_URL 注入;
      # 未配置时 compose 兜底为 .invalid 域名(必然投递失败并留日志,便于发现配置缺失)
      - url: ${ALERT_WEBHOOK_URL}
        send_resolved: true
    email_configs:
      - to: admin@humanvalue.ai
        send_resolved: true

  - name: "warning-email"
    email_configs:
      - to: admin@humanvalue.ai
        send_resolved: true

# 告警抑制规则(避免告警风暴)
inhibit_rules:
  # 评估失败率高时抑制 P99 延迟告警(失败率说明已有问题)
  - source_match:
      alertname: HumanvalueEvaluationFailureRateHigh
    target_match:
      alertname: HumanvalueEvaluationP99LatencyHigh
    equal: ["service"]
